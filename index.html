import sys
import asyncio
import platform
from pathlib import Path

async def custom_site():
    import embed
    platform.document.body.style.background = "#091b12"
    platform.window.canvas.style.visibility = "visible"

    bundle = "flippy-web"
    appdir = Path(f"/data/data/{bundle}")
    appdir.mkdir()

    if platform.window.location.host.find('.itch.zone') > 0:
        import zipfile
        async with platform.fopen("flippy-web.apk", "rb") as archive:
            with zipfile.ZipFile(archive) as zip_ref:
                zip_ref.extractall(appdir.as_posix())
    else:
        import tarfile
        async with platform.fopen("flippy-web.tar.gz", "rb") as archive:
            tar = tarfile.open(fileobj=archive, mode="r:gz")
            tar.extractall(path=appdir.as_posix(), filter='tar')
            tar.close()

    platform.run_main(PyConfig, loaderhome=appdir / "assets", loadermain=None)

    while embed.counter() < 0:
        await asyncio.sleep(.1)

    main = appdir / "assets" / "main.py"

    if not platform.window.MM.UME:
        __import__(__name__).__file__ = main
        start_gate = platform.window.document.getElementById("start-gate")
        if start_gate:
            start_gate.classList.add("active")
        while not platform.window.MM.UME:
            await asyncio.sleep(.1)
        if start_gate:
            start_gate.classList.remove("active")

    await TopLevel_async_handler.start_toplevel(platform.shell, console=False)
    __import__(__name__).__file__ = main

    def ui_callback(pkg):
        loader_text = platform.window.document.getElementById("loader-text")
        if loader_text:
            loader_text.innerText = f"Loading {pkg}..."

    await shell.source(main, callback=ui_callback)

    loader = platform.window.document.getElementById("loading-screen")
    if loader:
        loader.style.opacity = "0"
        await asyncio.sleep(0.3)
        loader.style.display = "none"

    platform.window.window_resize()

asyncio.run(custom_site())

    <script type="application/javascript">
    const progressBar = document.getElementById("custom-progress");
    const progressEl = document.getElementById("progress");
    const statusEl = document.getElementById("status");
    const loaderText = document.getElementById("loader-text");

    const observer = new MutationObserver(() => {
        const val = progressEl.getAttribute("value") || "0";
        if (progressBar) progressBar.style.width = val + "%";
        if (loaderText && statusEl.innerText) loaderText.innerText = statusEl.innerText;
    });
    observer.observe(progressEl, { attributes: true });

    function handleStart() {
        if (window.MM && window.MM.UME !== undefined) window.MM.UME = true;
        document.getElementById("start-gate").classList.remove("active");
    }

    function toggleFullScreen() {
        if (!document.fullscreenElement) {
            document.documentElement.requestFullscreen().catch(() => {});
        } else {
            if (document.exitFullscreen) document.exitFullscreen();
        }
    }

    async function custom_onload(debug_hidden) {
        if (document.getElementById("pyconsole")) document.getElementById("pyconsole").hidden = true;
    }
    </script>
